p_pcd_full: .5

train:
  seed: 2025
  epochs: 200
  batch_size: 64
  # accum_grad: 1
  output: runs

  loss_weight:
    tog: 1.
    # consist: .5

  metric:
    monitor: val/part/acc
    mode: max
    # patience: 50

  #  ema:
  #    beta: 0.9999
  #    update_after_step: 6000     # train_steps * epochs * 0.2
  #    update_every: 20

  optimizer:
    type: AdamW
    lr0: 0.001  # initial learning rate
    lrf: 0.01  # final OneCycleLR learning rate (lr0 * lrf)
    kwargs:
      weight_decay: 0.  # optimizer weight decay
